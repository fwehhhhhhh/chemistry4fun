<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tab title text configuration -->
    <title>Chemistry4Fun</title>
    
    <!-- Inline SVG Test Tube Emoji Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧪</text></svg>">

    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #0b0b0c; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
        }
        
        /* Profile attribution block in upper-right corner */
        .credit-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #00ffcc;
            letter-spacing: 0.5px;
            background-color: #16161a;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #24242b;
        }
        
        h1 { margin-bottom: 30px; font-weight: 600; letter-spacing: 1px;}
        
        /* Grid boundaries for active dashboard selections */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        /* Interactive element card block styling */
        .card { 
            background-color: #16161a; 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            border: 1px solid #24242b; 
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 24px rgba(0, 255, 204, 0.25); 
            border-color: #00ffcc; 
        }
        .card img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            border-radius: 8px; 
            background-color: #010101; 
        }
        .card h3 { margin: 12px 0 3px 0; font-size: 1.05rem; font-weight: 600; color: #f0f0f0; }
        
        /* Main application player containment fields */
        #game-wrapper { display: none; width: 95vw; max-width: 1300px; flex-direction: column; }
        #game-container { width: 100%; height: 78vh; background-color: #000; border-radius: 12px 12px 0 0; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #333; border-bottom: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 20px; background-color: #121214; box-sizing: border-box; border: 1px solid #333; border-top: none; border-radius: 0 0 12px 12px; }
        .btn { background-color: #00ffcc; color: #121212; border: none; padding: 10px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #00ccaa; }
        .back-btn { background-color: #2a2a30; color: white; margin-bottom: 20px; display: none; }
        .back-btn:hover { background-color: #3f3f46; }
        
        .direct-fullscreen-btn { width: 100%; padding: 16px; font-size: 1.1rem; background-color: #ff3366; color: white; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; border-left: 1px solid #333; border-right: 1px solid #333; box-sizing: border-box; transition: background 0.2s; }
        .direct-fullscreen-btn:hover { background-color: #dd2255; }
        
        /* Fullscreen responsive formatting boundaries */
        :fullscreen #game-wrapper { width: 100vw !important; max-width: 100vw !important; height: 100vh !important; }
        :fullscreen #game-container { height: 100vh !important; border: none !important; border-radius: 0 !important; }
        :fullscreen .direct-fullscreen-btn, :fullscreen .controls { display: none !important; }
    </style>
</head>
<body>

    <!-- Upper-right profile credit note -->
    <div class="credit-tag">Made by halo4goat</div>

    <!-- Main Header Rebranded -->
    <h1 id="page-title">Chemistry4Fun</h1>

    <button class="btn back-btn" id="back-button" onclick="closeGame()">← Back to Library</button>

    <div class="grid" id="game-grid">
        <!-- Bloxd.io Card -->
        <div class="card" onclick="loadGame('https://math.wales', 'Bloxd.io')">
            <img src="https://crazygames.com" alt="Bloxd.io">
            <h3>Bloxd.io</h3>
        </div>
        
        <!-- Orbit Beats Card (Pointed straight to the clean repository address) -->
        <div class="card" onclick="loadGame('https://undeadcorridor.github.io/orbit-beats', 'Orbit Beats')">
            <img src="https://gamedistribution.com" alt="Orbit Beats">
            <h3>Orbit Beats</h3>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="game-container"><iframe id="game-frame" src="" allow="gamepad *; keyboard *; mouse *; fullscreen *" scrolling="no"></iframe></div>
        <button class="direct-fullscreen-btn" onclick="toggleNativeFullscreen()">⚡ ACTIVATE FULLSCREEN MODE ⚡</button>
        <div class="controls">
            <span id="current-game-title" style="font-weight: bold; color: #00ffcc;">Game Loading...</span>
            <button class="btn" onclick="toggleNativeFullscreen()">🗖 Go Fullscreen</button>
        </div>
    </div>

    <!-- REACTION ROUTER SCRIPT CORE -->
    <script>
        const grid = document.getElementById('game-grid'), wrapper = document.getElementById('game-wrapper'), frame = document.getElementById('game-frame'), backBtn = document.getElementById('back-button'), titleText = document.getElementById('current-game-title'), mainTitle = document.getElementById('page-title');
        function loadGame(url, name) { grid.style.display = 'none'; mainTitle.style.display = 'none'; wrapper.style.display = 'flex'; backBtn.style.display = 'block'; titleText.textContent = name; frame.src = url; setTimeout(() => { frame.focus(); }, 100); }
        function closeGame() { if (document.fullscreenElement) { document.exitFullscreen(); } frame.src = ""; wrapper.style.display = 'none'; backBtn.style.display = 'none'; grid.style.width = '100%'; grid.style.display = 'grid'; mainTitle.style.display = 'block'; }
        function toggleNativeFullscreen() { if (!document.fullscreenElement) { wrapper.requestFullscreen().catch(err => { alert("Fullscreen blocked: " + err.message); }); } else { document.exitFullscreen(); } }
        document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) { frame.focus(); } });
    </script>

</body>
</html>
