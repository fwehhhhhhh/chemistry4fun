<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry4Fun</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧪</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0b0c; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .version-tag { position: absolute; top: 20px; left: 20px; font-size: 0.95rem; font-weight: bold; color: #ff3366; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 20px; border: 1px solid #24242b; }
        .credit-tag { position: absolute; top: 20px; right: 20px; font-size: 0.95rem; font-weight: bold; color: #00ffcc; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 20px; border: 1px solid #24242b; }
        h1 { margin-bottom: 30px; font-weight: 600; letter-spacing: 1px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #16161a; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #24242b; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(0, 255, 204, 0.25); border-color: #00ffcc; }
        .card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; background-color: #010101; }
        .card h3 { margin: 12px 0 3px 0; font-size: 1.05rem; font-weight: 600; color: #f0f0f0; }
    </style>
</head>
<body>

    <div class="version-tag">v2.00</div>
    <div class="credit-tag">Made by halo4goat</div>

    <h1>Chemistry4Fun</h1>

    <div class="grid" id="game-grid">
        <div class="card" onclick="cloakGame('https://math.wales', 'Bloxd.io')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232a2a2a'/><path d='M30,30 H70 V70 H30 Z' fill='%2355aa55'/><path d='M40,40 H60 V60 H40 Z' fill='%2388dd88'/></svg>" alt="Bloxd.io">
            <h3>Bloxd.io</h3>
        </div>
        
        <div class="card" onclick="cloakGame('https://gamedistribution.com', 'Orbit Beats')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111118'/><circle cx='35' cy='50' r='12' fill='%23ff3344'/><circle cx='65' cy='50' r='12' fill='%233344ff'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23333' stroke-width='2' stroke-dasharray='4'/></svg>" alt="Orbit Beats">
            <h3>Orbit Beats</h3>
        </div>
        
        <div class="card" onclick="cloakGame('https://gamedistribution.com', 'Undead Invasion')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1a1a'/><text y='55' x='10' font-size='45' fill='%23ff3333'>痕</text></svg>" alt="Undead Invasion">
            <h3>Undead Invasion</h3>
        </div>
        
        <div class="card" onclick="cloakGame('https://veck.io', 'Veck.io')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050510'/><polygon points='50,20 80,75 20,75' fill='none' stroke='%23ffcc00' stroke-width='3'/></svg>" alt="Veck.io">
            <h3>Veck.io</h3>
        </div>

        <div class="card" onclick="cloakGame('https://gamedistribution.com', 'Retro Bowl')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%235c3a21'/><path d='M20,50 Q50,20 80,50 Q50,80 20,50 Z' fill='%238B5A2B'/><line x1='30' y1='50' x2='70' y2='50' stroke='white' stroke-width='3'/><line x1='40' y1='43' x2='40' y2='57' stroke='white' stroke-width='2'/><line x1='50' y1='43' x2='50' y2='57' stroke='white' stroke-width='2'/><line x1='60' y1='43' x2='60' y2='57' stroke='white' stroke-width='2'/></svg>" alt="Retro Bowl">
            <h3>Retro Bowl</h3>
        </div>

        <div class="card" onclick="cloakGame('https://gamedistribution.com', 'Tunnel Rush')">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><circle cx='50' cy='50' r='40' fill='none' stroke='%23ff00ff' stroke-width='4'/><circle cx='50' cy='50' r='25' fill='none' stroke='%2300ffff' stroke-width='3'/><circle cx='50' cy='50' r='10' fill='none' stroke='%23ffff00' stroke-width='2'/></svg>" alt="Tunnel Rush">
            <h3>Tunnel Rush</h3>
        </div>
    </div>

    <script>
        function cloakGame(url, title) {
            let popup = window.open('about:blank', '_blank');
            if (!popup) {
                alert("Please allow popups for this site so the game can launch unblocked!");
                return;
            }

            let doc = popup.document;
            doc.title = "Chemistry Experiment - " + title;
            
            doc.write(`
                <html style="margin:0;padding:0;overflow:hidden;background:#000;height:100%;">
                <head>
                    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧪</text></svg>">
                </head>
                <body style="margin:0;padding:0;height:100%;width:100%;">
                    <iframe src="${url}" style="border:none;width:100%;height:100%;margin:0;padding:0;" allow="autoplay; keyboard-map *; gamepad *; keyboard *; mouse *; fullscreen *; local-storage *; session-storage *"></iframe>
                </body>
                </html>
            `);
            doc.close();
        }
    </script>

</body>
</html>
