<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover { transform: scale(1.05); background-color: #3a3a3a; }
        .card img { width: 100%; border-radius: 4px; }
        .game-link { color: #00ffcc; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Project Dashboard</h1>
    
    <div class="grid">
        <!-- Game Card 1 -->
        <div class="card">
            <h3>Retro Arcade</h3>
            <!-- Replace the URL below with your target game's iframe link -->
            <a class="game-link" href="https://example.com">Play Game</a>
        </div>
        
        <!-- Add more game cards by copying the block above -->
    </div>

</body>
</html>
