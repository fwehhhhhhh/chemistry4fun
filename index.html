<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry4Fun</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0b0c; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .version-tag { position: absolute; top: 20px; left: 20px; font-size: 0.95rem; font-weight: bold; color: #ff3366; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 20px; border: 1px solid #24242b; }
        .credit-tag { position: absolute; top: 20px; right: 20px; font-size: 0.95rem; font-weight: bold; color: #00ffcc; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 20px; border: 1px solid #24242b; }
        h1 { margin-bottom: 15px; font-weight: 600; letter-spacing: 1px;}
        .tab-container { display: flex; gap: 10px; margin-bottom: 30px; background-color: #16161a; padding: 6px; border-radius: 8px; border: 1px solid #24242b; }
        .tab-btn { background: none; border: none; color: #888; padding: 10px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn.active { background-color: #00ffcc; color: #121212; }
        .view-section { display: none; width: 100%; max-width: 1200px; }
        .view-section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; margin: 0 auto; }
        .card { background-color: #16161a; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #24242b; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(0, 255, 204, 0.25); border-color: #00ffcc; }
        .card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; background-color: #010101; }
        .card h3 { margin: 12px 0 3px 0; font-size: 1.05rem; font-weight: 600; color: #f0f0f0; }
        .auth-box { background-color: #16161a; border-radius: 12px; border: 1px solid #24242b; padding: 30px; max-width: 400px; margin: 40px auto; text-align: center; }
        .auth-box h2 { margin-top: 0; color: #00ffcc; font-size: 1.5rem; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #24242b; background-color: #0b0b0c; color: white; box-sizing: border-box; font-size: 1rem; }
        .auth-box input:focus { border-color: #00ffcc; outline: none; }
        .auth-box .btn-submit { width: 100%; background-color: #00ffcc; color: #121212; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .auth-box .btn-submit:hover { background-color: #00ccaa; }
        .chat-container { background-color: #16161a; border-radius: 12px; border: 1px solid #24242b; max-width: 800px; margin: 0 auto; height: 60vh; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 15px 20px; background-color: #121214; border-bottom: 1px solid #24242b; display: flex; justify-content: space-between; align-items: center; }
        .chat-header span { font-weight: bold; color: #00ffcc; }
        .btn-logout { background-color: #ff3366; color: white; border: none; padding: 6px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-logout:hover { background-color: #dd2255; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 70%; padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .msg.incoming { background-color: #24242b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.outgoing { background-color: #00ffcc; color: #121212; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-meta { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.7; }
        .owner-tag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; background-color: #ffcc00; color: #121212; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.4px; vertical-align: middle; }
        .chat-header .owner-tag, .msg-meta .owner-tag { color: #121212; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px 20px; background-color: #121214; border-top: 1px solid #24242b; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #24242b; background-color: #0b0b0c; color: white; font-size: 1rem; }
        .chat-input-area input:focus { border-color: #00ffcc; outline: none; }
        .chat-input-area button { background-color: #00ffcc; color: #121212; border: none; padding: 0 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .chat-input-area button:hover { background-color: #00ccaa; }
    </style>
</head>

    <div id="chat-section" class="view-section">
        <div id="auth-container">
            <div class="auth-box">
                <h2>Choose a Username</h2>
                <input type="text" id="login-username" placeholder="Enter username...">
                <button class="btn-submit" onclick="handleSetupName()">Enter Chat</button>
            </div>
        </div>
        <div id="active-chat-box" class="chat-container" style="display: none;">
            <div class="chat-header">
                <div>Logged in as: <span id="chat-user-display"></span></div>
                <button class="btn-logout" onclick="handleLogout()">Change Name</button>
            </div>
            <div class="chat-messages" id="chat-msg-wall">
                <div class="msg incoming"><span class="msg-meta">System</span>Welcome to the Chemistry4Fun Lobby. Local session mapping active.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-message-input" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const CHAT_USERS_KEY = 'c4f_chat_users_v1';
        const ACTIVE_USER_KEY = 'c4f_active_chat_user_v1';

        let currentActiveUser = loadLoggedUser();

        function getStoredUsers() {
            let rawUsers = localStorage.getItem(CHAT_USERS_KEY);

            if (!rawUsers) {
                return [];
            }

            try {
                let users = JSON.parse(rawUsers);
                return Array.isArray(users) ? users : [];
            } catch (error) {
                return [];
            }
        }

        function saveStoredUsers(users) {
            localStorage.setItem(CHAT_USERS_KEY, JSON.stringify(users));
        }

        function normalizeUsername(username) {
            return username.trim().toLowerCase();
        }

        function getNextUserId(users) {
            return String(users.length + 1).padStart(4, '0');
        }

        function getOrCreateUser(username) {
            let users = getStoredUsers();
            let key = normalizeUsername(username);
            let existingUser = users.find(function (user) {
                return user.key === key;
            });

            if (existingUser) {
                return existingUser;
            }

            let user = {
                key: key,
                name: username.trim(),
                id: getNextUserId(users)
            };

            users.push(user);
            saveStoredUsers(users);
            return user;
        }

        function saveLoggedUser(user) {
            localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(user));
        }

        function loadLoggedUser() {
            let rawUser = localStorage.getItem(ACTIVE_USER_KEY);

            if (rawUser) {
                try {
                    let user = JSON.parse(rawUser);
                    if (user && user.name && user.id) {
                        return user;
                    }
                } catch (error) {
                    localStorage.removeItem(ACTIVE_USER_KEY);
                }
            }

            let legacyUser = localStorage.getItem('c4f_logged_user');

            if (legacyUser) {
                let legacyName = legacyUser.replace(/#\d+$/, '').trim();

                if (legacyName) {
                    let migratedUser = getOrCreateUser(legacyName);
                    saveLoggedUser(migratedUser);
                    localStorage.removeItem('c4f_logged_user');
                    return migratedUser;
                }
            }

            return null;
        }

        function formatUserTag(user) {
            return user.name + '#' + user.id;
        }

        function isOwnerUser(user) {
            return user && user.id === '0001';
        }

        function appendOwnerTag(target) {
            let tag = document.createElement('span');
            tag.className = 'owner-tag';
            tag.textContent = 'OWNER';
            target.appendChild(document.createTextNode(' '));
            target.appendChild(tag);
        }

        function renderActiveUser() {
            let display = document.getElementById('chat-user-display');
            display.textContent = formatUserTag(currentActiveUser);

            if (isOwnerUser(currentActiveUser)) {
                appendOwnerTag(display);
            }
        }

        function switchTab(t) {
            document.getElementById('games-tab-btn').classList.remove('active');
            document.getElementById('chat-tab-btn').classList.remove('active');
            document.getElementById('games-section').classList.remove('active');
            document.getElementById('chat-section').classList.remove('active');

            if (t === 'games') {
                document.getElementById('games-tab-btn').classList.add('active');
                document.getElementById('games-section').classList.add('active');
            } else {
                document.getElementById('chat-tab-btn').classList.add('active');
                document.getElementById('chat-section').classList.add('active');
                checkAuthStatus();
            }
        }

        function checkAuthStatus() {
            if (currentActiveUser) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('active-chat-box').style.display = 'flex';
                renderActiveUser();
            } else {
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('active-chat-box').style.display = 'none';
            }
        }

        function handleSetupName() {
            let u = document.getElementById('login-username').value.trim();

            if (!u) {
                alert('DOES NOT WORK PLEASE DO NOT USE THIS.');
                return;
            }

            currentActiveUser = getOrCreateUser(u);
            saveLoggedUser(currentActiveUser);
            checkAuthStatus();
            document.getElementById('login-username').value = '';
        }

        function handleLogout() {
            currentActiveUser = null;
            localStorage.removeItem(ACTIVE_USER_KEY);
            checkAuthStatus();
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function appendChatMessage(direction, author, text, hasOwnerTag) {
            let wall = document.getElementById('chat-msg-wall');
            let message = document.createElement('div');
            let meta = document.createElement('span');

            message.className = 'msg ' + direction;
            meta.className = 'msg-meta';
            meta.textContent = author;

            if (hasOwnerTag) {
                appendOwnerTag(meta);
            }

            message.appendChild(meta);
            message.appendChild(document.createTextNode(text));
            wall.appendChild(message);
            wall.scrollTop = wall.scrollHeight;
        }

        function sendChatMessage() {
            let input = document.getElementById('chat-message-input');
            let text = input.value.trim();

            if (!text || !currentActiveUser) {
                return;
            }

            appendChatMessage('outgoing', formatUserTag(currentActiveUser), text, isOwnerUser(currentActiveUser));
            input.value = '';

            setTimeout(function () {
                appendChatMessage('incoming', 'Lab-Assistant', 'Message logged locally.', false);
            }, 800);
        }

        function cloakGame(url, title, openFullscreen) {
            let popup = window.open('about:blank', '_blank');

            if (!popup) {
                alert('Please allow popups!');
                return;
            }

            let iframeUrl = url;

            try {
                iframeUrl = new URL(url, window.location.href).href;
            } catch (error) {
                iframeUrl = url;
            }

            popup.document.open();
            popup.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>New Tab</title><style>html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;}iframe{border:none;width:100%;height:100%;display:block;}</style></head><body></body></html>');
            popup.document.close();

            let iframe = popup.document.createElement('iframe');
            iframe.src = iframeUrl;
            iframe.allow = 'autoplay; fullscreen; gamepad; pointer-lock';
            iframe.setAttribute('allowfullscreen', '');
            iframe.allowFullscreen = true;
            popup.document.body.appendChild(iframe);

            popup.document.title = 'Chemistry Experiment - ' + title;

            let link = popup.document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/svg+xml';
            link.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E";
            popup.document.head.appendChild(link);

            if (openFullscreen) {
                requestPopupFullscreen(popup, iframe);
            }
        }

        function requestPopupFullscreen(popup, target) {
            let request = target.requestFullscreen ||
                target.webkitRequestFullscreen ||
                target.mozRequestFullScreen ||
                target.msRequestFullscreen;

            try {
                let result = request ? request.call(target) : null;

                if (result && typeof result.catch === 'function') {
                    result.catch(function () {
                        addFullscreenFallback(popup, target);
                    });
                } else if (!request) {
                    addFullscreenFallback(popup, target);
                }
            } catch (error) {
                addFullscreenFallback(popup, target);
            }
        }

        function addFullscreenFallback(popup, target) {
            let button = popup.document.createElement('button');
            button.textContent = 'Fullscreen';
            button.style.position = 'fixed';
            button.style.right = '14px';
            button.style.bottom = '14px';
            button.style.zIndex = '20';
            button.style.padding = '10px 14px';
            button.style.border = '0';
            button.style.borderRadius = '6px';
            button.style.background = '#00ffcc';
            button.style.color = '#121212';
            button.style.fontWeight = '700';
            button.style.cursor = 'pointer';
            button.onclick = function () {
                requestPopupFullscreen(popup, target);
                button.remove();
            };
            popup.document.body.appendChild(button);
        }

        checkAuthStatus();
    </script>
</body>
</html>
