<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 30px; font-weight: 600; letter-spacing: 1px;}
        
        /* Grid Layout for initial menu view */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            width: 100%;
            max-width: 1000px; 
            margin: 0 auto; 
        }
        
        /* Clickable game card style */
        .card { 
            background-color: #1e1e1e; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            border: 1px solid #2d2d2d;
        }
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
        }
        .card img { 
            width: 100%; 
            height: 140px;
            object-fit: cover;
            border-radius: 8px; 
            background-color: #111;
        }
        .card h3 { margin: 12px 0 5px 0; font-size: 1.1rem; }

        /* Unified frame layout structure to isolate game engine window */
        #game-wrapper {
            display: none;
            width: 90vw;
            max-width: 1100px;
            flex-direction: column;
        }

        #game-container {
            width: 100%;
            height: 70vh;
            background-color: #000;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-bottom: none;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Control Panel bar below active game */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 15px;
            background-color: #1a1a1a;
            box-sizing: border-box;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 12px 12px;
        }
        .btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #00ccaa; }
        .back-btn { background-color: #444; color: white; margin-bottom: 15px; display: none;}
        .back-btn:hover { background-color: #555; }
        
        /* FIXED: Direct persistent layout button below the running game */
        .direct-fullscreen-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            background-color: #ff3366;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .direct-fullscreen-btn:hover { background-color: #dd2255; }
    </style>
</head>
<body>

    <h1 id="page-title">Project Dashboard</h1>

    <!-- Library navigation back trigger -->
    <button class="btn back-btn" id="back-button" onclick="closeGame()">← Back to Library</button>

    <!-- Menu Selection View Grid -->
    <div class="grid" id="game-grid">

        <!-- Bloxd.io Card (Using Official Unblocked Academic Domain Proxy) -->
        <div class="card" onclick="loadGame('https://math.wales', 'Bloxd.io')">
            <img src="https://crazygames.com" alt="Bloxd.io">
            <h3>Bloxd.io</h3>
        </div>

        <!-- Placeholder Template Card (Modify URL to add another title) -->
        <div class="card" onclick="loadGame('https://example.com', 'Example Application')">
            <img src="https://unsplash.com" alt="Arcade Game">
            <h3>Retro Arcade</h3>
        </div>

    </div>

    <!-- FIXED STRUCTURE: Wrapper contains frame, permanent middle button, and controls -->
    <div id="game-wrapper">
        <div id="game-container">
            <iframe id="game-frame" src="" allow="gamepad *; keyboard *; mouse *; fullscreen *" scrolling="no"></iframe>
        </div>
        
        <!-- Dedicated Action Row Button: Now physically locked directly beneath the frame layout -->
        <button class="direct-fullscreen-btn" onclick="toggleNativeFullscreen()">⚡ ACTIVATE FULLSCREEN MODE ⚡</button>
        
        <div class="controls">
            <span id="current-game-title" style="font-weight: bold; color: #00ffcc;">Game Loading...</span>
            <button class="btn" onclick="toggleNativeFullscreen()">🗖 Go Fullscreen</button>
        </div>
    </div>

    <!-- Interface Viewport Router Script Engine -->
    <script>
        const grid = document.getElementById('game-grid');
        const wrapper = document.getElementById('game-wrapper');
        const frame = document.getElementById('game-frame');
        const backBtn = document.getElementById('back-button');
        const titleText = document.getElementById('current-game-title');
        const mainTitle = document.getElementById('page-title');

        // Streams targeted content elements dynamically upon grid trigger
        function loadGame(url, name) {
            grid.style.display = 'none';
            mainTitle.style.display = 'none';
            
            wrapper.style.display = 'flex';
            backBtn.style.display = 'block';
            
            titleText.textContent = name;
            frame.src = url;
            frame.focus();
        }

        // Flushes the frame link source and returns to dashboard hub
        function closeGame() {
            frame.src = ""; 
            wrapper.style.display = 'none';
            backBtn.style.display = 'none';
            
            grid.style.display = 'grid';
            mainTitle.style.display = 'block';
        }

        // Activates true canvas container resolution via HTML5 API on the entire package wrapper
        function toggleNativeFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
